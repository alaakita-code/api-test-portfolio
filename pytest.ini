[pytest]
# Let tests import from the project root, e.g. "from utils.api_client import send_request".
pythonpath = .
testpaths = tests
# -ra: show a short reason for every test that did not pass.
# --html: write one self-contained report file that can be opened offline.
addopts = -ra --html=reports/report.html --self-contained-html
# Show request logs for failed tests.
log_level = INFO
markers =
    smoke: fastest check that the API is reachable and the setup works
